<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Buji Computer QA — local test note</title><style>
body{font:17px 'Segoe UI',sans-serif;background:#faf9f7;color:#292a27;padding:36px;margin:0}h1{font-size:27px;margin:0 0 12px}p{line-height:1.6;color:#575b53}label{display:block;margin-top:25px;font-weight:600}textarea{display:block;margin:10px 0 18px;width:100%;height:160px;box-sizing:border-box;font:19px 'Segoe UI';padding:15px;border:1px solid #aaa;border-radius:8px}button{font:17px 'Segoe UI';background:#24694c;color:white;padding:12px 20px;border:0;border-radius:8px;cursor:pointer}output{display:block;margin-top:18px}
</style></head><body><h1>Computer access test</h1><p>This isolated app contains only a test note. It has no network or personal data.</p><label for="note">Note</label><textarea id="note" aria-label="Note">Original QA note</textarea><button id="save">Save note</button><output id="result" aria-live="polite">Not saved yet</output><script>document.getElementById('note').addEventListener('input',()=>{document.getElementById('result').textContent='Unsaved changes';});document.getElementById('save').addEventListener('click',async()=>{document.getElementById('result').textContent=await window.fixture.save(document.getElementById('note').value);});</script></body></html>
