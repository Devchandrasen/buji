name: Bug report
description: Report a reproducible Buji problem
title: "[Bug]: "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Buji version and Windows version
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      description: Use a small disposable project. Leave private files and credentials out.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: input
    id: model
    attributes:
      label: Local model and server, if relevant
  - type: textarea
    id: evidence
    attributes:
      label: Relevant logs or screenshots
      description: Review for personal data before posting.
