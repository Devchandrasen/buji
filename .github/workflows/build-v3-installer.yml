name: Build Buji V3 signing candidate

on:
  push:
    branches: [release/buji-v3-signpath]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2025
    timeout-minutes: 25
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm test
      - run: npm run build
      - name: Compile installer from source
        shell: pwsh
        run: |
          python tools/windows-release/build-installer.py `
            --cache "$env:RUNNER_TEMP\buji-inputs" `
            --output "$env:RUNNER_TEMP\buji-unsigned\Buji-V3-Setup-x64.exe"
      - name: Upload unsigned signing candidate
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: Buji-V3-unsigned-installer
          path: ${{ runner.temp }}/buji-unsigned/Buji-V3-Setup-x64.exe
          if-no-files-found: error
          compression-level: 0
