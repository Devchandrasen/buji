name: Build Windows release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build
        required: true
        default: v1.0.1
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm test
      - run: npm run package
      - name: Archive and checksum
        shell: pwsh
        run: |
          Compress-Archive -Path outputs/BujiV1/* -DestinationPath Buji-V1-Windows-x64.zip
          $digest = (Get-FileHash Buji-V1-Windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          "$digest  Buji-V1-Windows-x64.zip" | Set-Content SHA256SUMS.txt -Encoding ascii
      - name: Attach to release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        shell: pwsh
        run: gh release upload $env:RELEASE_TAG Buji-V1-Windows-x64.zip SHA256SUMS.txt --clobber
